{{- if not .Values.secrets.existingSecret }}
{{- $jwt := .Values.secrets.jwtSecretKey | default "" }}
{{- if or (not $jwt) (eq $jwt "CHANGE-ME-in-production") }}
{{- fail "secrets.jwtSecretKey must be set to a random value (e.g. openssl rand -hex 32), or use secrets.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "consentos.secretName" . }}
  labels:
    {{- include "consentos.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | b64enc | quote }}
  postgresql-password: {{ .Values.secrets.postgresqlPassword | b64enc | quote }}
{{- end }}
